name: evpn-vxlan-fabric

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:26.7.2
    linux:
      image: ghcr.io/srl-labs/network-multitool

  nodes:
    spine1:
      kind: nokia_srlinux
      type: ixr-d3l
      startup-config: configs/spine1.cli
    spine2:
      kind: nokia_srlinux
      type: ixr-d3l
      startup-config: configs/spine2.cli
    leaf1:
      kind: nokia_srlinux
      type: ixr-d2l
      startup-config: configs/leaf1.cli
    leaf2:
      kind: nokia_srlinux
      type: ixr-d2l
      startup-config: configs/leaf2.cli
    leaf3:
      kind: nokia_srlinux
      type: ixr-d2l
      startup-config: configs/leaf3.cli
    leaf4:
      kind: nokia_srlinux
      type: ixr-d2l
      startup-config: configs/leaf4.cli
    host1:
      kind: linux
      exec:
        - "ip link add bond0 type bond mode 802.3ad lacp_rate fast xmit_hash_policy layer3+4"
        - "ip link set address 00:c1:ab:00:01:01 dev bond0"
        - "ip link set eth1 down"
        - "ip link set eth1 master bond0"
        - "ip link set eth1 up"
        - "ip link set eth2 down"
        - "ip link set eth2 master bond0"
        - "ip link set eth2 up"
        - "ip link set bond0 up"
        - "ip addr add 172.16.10.1/24 dev bond0"
        - "ip route add 172.16.20.0/24 via 172.16.10.254"
    host2:
      kind: linux
      exec:
        - "ip addr add 172.16.20.1/24 dev eth1"
        - "ip route add 172.16.10.0/24 via 172.16.20.254"
    host3:
      kind: linux
      exec:
        - "ip addr add 172.16.10.2/24 dev eth1"
        - "ip route add 172.16.20.0/24 via 172.16.10.254"

  links:
    - endpoints: ["leaf1:ethernet-1/49", "spine1:ethernet-1/1"]
    - endpoints: ["leaf1:ethernet-1/50", "spine2:ethernet-1/1"]
    - endpoints: ["leaf2:ethernet-1/49", "spine1:ethernet-1/2"]
    - endpoints: ["leaf2:ethernet-1/50", "spine2:ethernet-1/2"]
    - endpoints: ["leaf3:ethernet-1/49", "spine1:ethernet-1/3"]
    - endpoints: ["leaf3:ethernet-1/50", "spine2:ethernet-1/3"]
    - endpoints: ["leaf4:ethernet-1/49", "spine1:ethernet-1/4"]
    - endpoints: ["leaf4:ethernet-1/50", "spine2:ethernet-1/4"]
    - endpoints: ["leaf1:ethernet-1/1", "host1:eth1"]
    - endpoints: ["leaf2:ethernet-1/1", "host1:eth2"]
    - endpoints: ["leaf3:ethernet-1/1", "host2:eth1"]
    - endpoints: ["leaf4:ethernet-1/1", "host3:eth1"]
