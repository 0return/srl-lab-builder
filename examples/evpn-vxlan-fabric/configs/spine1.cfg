# spine1 — 7220 IXR-D3L — SR Linux 26.7.2
# Partial startup config (flat CLI). containerlab applies it on top of the default config and commits once.

# ── System ──────────────────────────────────────────────────────
set / system name host-name spine1

# ── Interfaces ──────────────────────────────────────────────────
set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.0.0.1/32
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "to leaf1 ethernet-1/49"
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 192.168.0.1/31
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 description "to leaf2 ethernet-1/49"
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/2 subinterface 0 ipv4 address 192.168.0.5/31
set / interface ethernet-1/3 admin-state enable
set / interface ethernet-1/3 description "to leaf3 ethernet-1/49"
set / interface ethernet-1/3 subinterface 0 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/3 subinterface 0 ipv4 address 192.168.0.9/31
set / interface ethernet-1/4 admin-state enable
set / interface ethernet-1/4 description "to leaf4 ethernet-1/49"
set / interface ethernet-1/4 subinterface 0 admin-state enable
set / interface ethernet-1/4 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/4 subinterface 0 ipv4 address 192.168.0.13/31

# ── Default network-instance ────────────────────────────────────
set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default router-id 10.0.0.1
set / network-instance default interface system0.0
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface ethernet-1/4.0

# ── BGP: eBGP underlay + iBGP EVPN overlay ──────────────────────
set / routing-policy prefix-set system-loopbacks prefix 10.0.0.0/24 mask-length-range 32..32
set / routing-policy policy underlay-loopbacks statement 10 match prefix prefix-set system-loopbacks
set / routing-policy policy underlay-loopbacks statement 10 action policy-result accept
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65100
set / network-instance default protocols bgp router-id 10.0.0.1
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath maximum-paths 64
set / network-instance default protocols bgp group underlay description "eBGP underlay"
set / network-instance default protocols bgp group underlay export-policy [ underlay-loopbacks ]
set / network-instance default protocols bgp group underlay import-policy [ underlay-loopbacks ]
set / network-instance default protocols bgp group underlay afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp neighbor 192.168.0.0 peer-group underlay
set / network-instance default protocols bgp neighbor 192.168.0.0 peer-as 65001
set / network-instance default protocols bgp neighbor 192.168.0.0 description "leaf1"
set / network-instance default protocols bgp neighbor 192.168.0.4 peer-group underlay
set / network-instance default protocols bgp neighbor 192.168.0.4 peer-as 65002
set / network-instance default protocols bgp neighbor 192.168.0.4 description "leaf2"
set / network-instance default protocols bgp neighbor 192.168.0.8 peer-group underlay
set / network-instance default protocols bgp neighbor 192.168.0.8 peer-as 65003
set / network-instance default protocols bgp neighbor 192.168.0.8 description "leaf3"
set / network-instance default protocols bgp neighbor 192.168.0.12 peer-group underlay
set / network-instance default protocols bgp neighbor 192.168.0.12 peer-as 65004
set / network-instance default protocols bgp neighbor 192.168.0.12 description "leaf4"
set / network-instance default protocols bgp group overlay description "iBGP EVPN overlay"
set / network-instance default protocols bgp group overlay peer-as 65500
set / network-instance default protocols bgp group overlay local-as as-number 65500
set / network-instance default protocols bgp group overlay transport local-address 10.0.0.1
set / network-instance default protocols bgp group overlay afi-safi evpn admin-state enable
set / network-instance default protocols bgp group overlay afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp group overlay route-reflector client true
set / network-instance default protocols bgp group overlay route-reflector cluster-id 10.0.0.1
set / network-instance default protocols bgp neighbor 10.0.0.3 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.0.3 description "leaf1 (RR client)"
set / network-instance default protocols bgp neighbor 10.0.0.4 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.0.4 description "leaf2 (RR client)"
set / network-instance default protocols bgp neighbor 10.0.0.5 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.0.5 description "leaf3 (RR client)"
set / network-instance default protocols bgp neighbor 10.0.0.6 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.0.6 description "leaf4 (RR client)"
