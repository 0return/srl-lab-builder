# leaf2 — 7220 IXR-D2L — SR Linux 26.7.2
# Partial startup config (flat CLI). containerlab applies it on top of the default config and commits once.

# ── System ──────────────────────────────────────────────────────
set / system name host-name leaf2

# ── Interfaces ──────────────────────────────────────────────────
set / interface system0 admin-state enable
set / interface system0 subinterface 0 admin-state enable
set / interface system0 subinterface 0 ipv4 admin-state enable
set / interface system0 subinterface 0 ipv4 address 10.0.0.4/32
set / interface ethernet-1/49 admin-state enable
set / interface ethernet-1/49 description "to spine1 ethernet-1/2"
set / interface ethernet-1/49 subinterface 0 admin-state enable
set / interface ethernet-1/49 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/49 subinterface 0 ipv4 address 192.168.0.4/31
set / interface ethernet-1/50 admin-state enable
set / interface ethernet-1/50 description "to spine2 ethernet-1/2"
set / interface ethernet-1/50 subinterface 0 admin-state enable
set / interface ethernet-1/50 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/50 subinterface 0 ipv4 address 192.168.0.6/31

# ── Access interfaces ───────────────────────────────────────────
set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 description "member of lag1 to host1"
set / interface ethernet-1/1 ethernet aggregate-id lag1
set / interface lag1 admin-state enable
set / interface lag1 description "host1 bond0 (ES-host1-bond0)"
set / interface lag1 vlan-tagging true
set / interface lag1 lag lag-type lacp
set / interface lag1 lag lacp interval FAST
set / interface lag1 lag lacp lacp-mode ACTIVE
set / interface lag1 lag lacp admin-key 11
set / interface lag1 lag lacp system-id-mac 02:00:00:00:00:01
set / interface lag1 lag lacp system-priority 100
set / interface lag1 subinterface 0 type bridged
set / interface lag1 subinterface 0 admin-state enable
set / interface lag1 subinterface 0 vlan encap untagged

# ── EVPN multihoming ────────────────────────────────────────────
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-host1-bond0 admin-state enable
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-host1-bond0 esi 00:11:11:11:11:11:11:00:00:01
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-host1-bond0 multi-homing-mode all-active
set / system network-instance protocols evpn ethernet-segments bgp-instance 1 ethernet-segment ES-host1-bond0 interface lag1
set / system network-instance protocols bgp-vpn bgp-instance 1

# ── Default network-instance ────────────────────────────────────
set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default router-id 10.0.0.4
set / network-instance default interface system0.0
set / network-instance default interface ethernet-1/49.0
set / network-instance default interface ethernet-1/50.0

# ── BGP: eBGP underlay + iBGP EVPN overlay ──────────────────────
set / routing-policy prefix-set system-loopbacks prefix 10.0.0.0/24 mask-length-range 32..32
set / routing-policy policy underlay-loopbacks statement 10 match prefix prefix-set system-loopbacks
set / routing-policy policy underlay-loopbacks statement 10 action policy-result accept
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65002
set / network-instance default protocols bgp router-id 10.0.0.4
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp afi-safi ipv4-unicast multipath maximum-paths 64
set / network-instance default protocols bgp group underlay description "eBGP underlay"
set / network-instance default protocols bgp group underlay export-policy [ underlay-loopbacks ]
set / network-instance default protocols bgp group underlay import-policy [ underlay-loopbacks ]
set / network-instance default protocols bgp group underlay afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp neighbor 192.168.0.5 peer-group underlay
set / network-instance default protocols bgp neighbor 192.168.0.5 peer-as 65100
set / network-instance default protocols bgp neighbor 192.168.0.5 description "spine1"
set / network-instance default protocols bgp neighbor 192.168.0.7 peer-group underlay
set / network-instance default protocols bgp neighbor 192.168.0.7 peer-as 65100
set / network-instance default protocols bgp neighbor 192.168.0.7 description "spine2"
set / network-instance default protocols bgp group overlay description "iBGP EVPN overlay"
set / network-instance default protocols bgp group overlay peer-as 65500
set / network-instance default protocols bgp group overlay local-as as-number 65500
set / network-instance default protocols bgp group overlay transport local-address 10.0.0.4
set / network-instance default protocols bgp group overlay afi-safi evpn admin-state enable
set / network-instance default protocols bgp group overlay afi-safi ipv4-unicast admin-state disable
set / network-instance default protocols bgp neighbor 10.0.0.1 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.0.1 description "spine1 (RR)"
set / network-instance default protocols bgp neighbor 10.0.0.2 peer-group overlay
set / network-instance default protocols bgp neighbor 10.0.0.2 description "spine2 (RR)"

# ── VXLAN tunnel interfaces ─────────────────────────────────────
set / tunnel-interface vxlan1 vxlan-interface 10 type bridged
set / tunnel-interface vxlan1 vxlan-interface 10 ingress vni 10
set / tunnel-interface vxlan1 vxlan-interface 100 type routed
set / tunnel-interface vxlan1 vxlan-interface 100 ingress vni 100

# ── MAC-VRF mac-vrf-10 (EVI 10, VNI 10) ─────────────────────────
set / interface irb0 admin-state enable
set / interface irb0 subinterface 10 admin-state enable
set / interface irb0 subinterface 10 description "gateway mac-vrf-10"
set / interface irb0 subinterface 10 ipv4 admin-state enable
set / interface irb0 subinterface 10 ipv4 address 172.16.10.254/24 anycast-gw true
set / interface irb0 subinterface 10 ipv4 address 172.16.10.254/24 primary
set / interface irb0 subinterface 10 ipv4 arp learn-unsolicited true
set / interface irb0 subinterface 10 ipv4 arp host-route populate dynamic
set / interface irb0 subinterface 10 ipv4 arp evpn advertise dynamic
set / interface irb0 subinterface 10 anycast-gw virtual-router-id 1
set / network-instance mac-vrf-10 type mac-vrf
set / network-instance mac-vrf-10 admin-state enable
set / network-instance mac-vrf-10 description "Tenant A · VLAN 10"
set / network-instance mac-vrf-10 interface lag1.0
set / network-instance mac-vrf-10 interface irb0.10
set / network-instance mac-vrf-10 vxlan-interface vxlan1.10
set / network-instance mac-vrf-10 protocols bgp-evpn bgp-instance 1 admin-state enable
set / network-instance mac-vrf-10 protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan1.10
set / network-instance mac-vrf-10 protocols bgp-evpn bgp-instance 1 evi 10
set / network-instance mac-vrf-10 protocols bgp-evpn bgp-instance 1 ecmp 4
set / network-instance mac-vrf-10 protocols bgp-vpn bgp-instance 1 route-distinguisher rd 10.0.0.4:10
set / network-instance mac-vrf-10 protocols bgp-vpn bgp-instance 1 route-target export-rt target:65500:10
set / network-instance mac-vrf-10 protocols bgp-vpn bgp-instance 1 route-target import-rt target:65500:10

# ── IP-VRF tenant-a (EVPN IFL VNI 100) ──────────────────────────
set / network-instance tenant-a type ip-vrf
set / network-instance tenant-a admin-state enable
set / network-instance tenant-a description "Tenant A routing"
set / network-instance tenant-a interface irb0.10
set / network-instance tenant-a vxlan-interface vxlan1.100
set / network-instance tenant-a protocols bgp-evpn bgp-instance 1 admin-state enable
set / network-instance tenant-a protocols bgp-evpn bgp-instance 1 vxlan-interface vxlan1.100
set / network-instance tenant-a protocols bgp-evpn bgp-instance 1 evi 100
set / network-instance tenant-a protocols bgp-evpn bgp-instance 1 ecmp 8
set / network-instance tenant-a protocols bgp-vpn bgp-instance 1 route-distinguisher rd 10.0.0.4:100
set / network-instance tenant-a protocols bgp-vpn bgp-instance 1 route-target export-rt target:65500:100
set / network-instance tenant-a protocols bgp-vpn bgp-instance 1 route-target import-rt target:65500:100
